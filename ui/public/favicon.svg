<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .bg { fill: #170D33; }
    .left-mountain { fill: #B4A7CB; }
    .right-mountain { fill: #2D1A54; }
    .teal { fill: #00a19b; }
  </style>
  <!-- Background -->
  <rect class="bg" width="100" height="100" rx="14"/>
  <!-- Left mountain (light lavender) -->
  <polygon class="left-mountain" points="10,78 38,28 56,60 38,60"/>
  <!-- Right mountain (deep indigo) -->
  <polygon class="right-mountain" points="35,78 62,30 90,78"/>
  <!-- Teal river/base accent -->
  <rect class="teal" x="10" y="76" width="80" height="6" rx="3"/>
</svg>
